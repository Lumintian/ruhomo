name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never interrupt an in-progress production deployment.
concurrency:
  group: ruhomo-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and test release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag, root version and main ancestry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${version}`) throw new Error(`tag ${tag} does not match root version ${version}`);
          NODE
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Pin verified commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:workerd
      - run: pnpm --filter @ruhomo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:prefix
      - uses: actions/cache@v4
        with:
          path: .cache/mihomo
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-mihomo.mjs') }}
      - run: pnpm test:integration

  deploy:
    name: Build and deploy verified commit
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUHOMO_BASE_PATH: ${{ vars.RUHOMO_BASE_PATH || '/' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm run deploy
